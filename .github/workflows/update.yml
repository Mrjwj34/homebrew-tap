name: update

# Keeps this tap in step with berth's releases without anyone touching it.
# It reads the latest release's checksums and rewrites the formula when the
# published hashes change, so a release only needs the tag it already pushes.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render the formula from the latest release
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re, urllib.request

          release = json.loads(urllib.request.urlopen(
              "https://api.github.com/repos/Mrjwj34/berth/releases/latest").read())
          tag = release["tag_name"]
          version = tag.lstrip("v")
          checksums = urllib.request.urlopen(
              f"https://github.com/Mrjwj34/berth/releases/download/{tag}/checksums.txt").read().decode()

          sums = {}
          for line in checksums.splitlines():
              parts = line.split()
              if len(parts) == 2:
                  sums[parts[1].lstrip("*")] = parts[0].lower()

          def asset(goos, arch, ext="tar.gz"):
              name = f"berth_{version}_{goos}_{arch}.{ext}"
              if name not in sums:
                  raise SystemExit(f"missing asset {name} in {tag}")
              return f"https://github.com/Mrjwj34/berth/releases/download/{tag}/{name}", sums[name]

          def block(goos):
              arm, arm_sum = asset(goos, "arm64")
              intel, intel_sum = asset(goos, "amd64")
              return f"""    if Hardware::CPU.arm?
                  url "{arm}"
                  sha256 "{arm_sum}"
                else
                  url "{intel}"
                  sha256 "{intel_sum}"
                end"""

          formula = f"""# Generated by .github/workflows/update.yml -- do not edit by hand.
          class Berth < Formula
            desc "Fast, daemonless local workspaces for parallel coding agents"
            homepage "https://github.com/Mrjwj34/berth"
            version "{version}"
            license "MIT"

            on_macos do
          {block("darwin")}
            end

            on_linux do
          {block("linux")}
            end

            livecheck do
              url "https://github.com/Mrjwj34/berth"
              strategy :github_latest
            end

            def install
              bin.install "berth"
            end

            test do
              assert_match version.to_s, shell_output("#{{bin}}/berth version")
            end
          end
          """
          pathlib.Path("Formula/berth.rb").write_text(formula, encoding="utf-8")
          print(f"rendered berth {version}")
          PY

      - name: Commit when the formula changed
        run: |
          if git diff --quiet; then
            echo "already current"
            exit 0
          fi
          version=$(grep -m1 'version "' Formula/berth.rb | cut -d'"' -f2)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/berth.rb
          git commit -m "berth ${version}"
          git push
